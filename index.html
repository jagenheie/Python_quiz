<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Quiz</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0b12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            padding: 16px;
        }
        .quiz-container {
            background: #0b0b12;
            width: 100%;
            max-width: 660px;
            padding: 24px 20px 32px;
            border: 1px solid #1a0b1a;
            border-radius: 8px;
            text-align: center;
        }
        .title {
            font-size: 16px;
            font-weight: bold;
            color: #ff00a0;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .score-row {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px 12px;
            margin: 10px 0 4px;
        }
        .score-label { font-size: 13px; font-weight: bold; color: #ffcc00; }
        .high-score-label { font-size: 11px; color: #00f0ff; opacity: 0.9; }
        .question-text {
            font-size: 17px;
            font-weight: bold;
            color: #ff00a0;
            padding: 24px 8px 16px;
            min-height: 80px;
        }
        .feedback-text {
            font-size: 14px;
            font-weight: bold;
            min-height: 32px;
            padding: 4px 0 12px;
        }
        .option-btn {
            display: block;
            width: 100%;
            max-width: 520px;
            margin: 7px auto;
            padding: 12px 16px;
            background: #1a0b1a;
            color: #00f0ff;
            border: none;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            box-shadow: 0 0 0 1px #2a152a;
        }
        .option-btn:hover:not(:disabled) {
            background: #2a152a;
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.12), 0 0 0 1px #00f0ff;
        }
        .option-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .option-btn .letter { display: inline-block; width: 26px; font-weight: bold; color: #ff00a0; }
        .option-btn.correct-answer {
            background: #003d1a !important;
            color: #00ff66 !important;
            box-shadow: 0 0 24px rgba(0, 255, 102, 0.15), 0 0 0 1px #00ff66 !important;
        }
        .option-btn.wrong-answer {
            background: #3d0000 !important;
            color: #ff0044 !important;
            box-shadow: 0 0 24px rgba(255, 0, 68, 0.15), 0 0 0 1px #ff0044 !important;
        }
        .option-btn.reveal-answer {
            background: #003d1a !important;
            color: #00ff66 !important;
            box-shadow: 0 0 24px rgba(0, 255, 102, 0.10), 0 0 0 1px #00ff66 !important;
        }
        .restart-btn {
            display: inline-block;
            margin: 16px auto 4px;
            padding: 12px 40px;
            background: #1a0b1a;
            color: #00f0ff;
            border: none;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 0 1px #2a152a;
            letter-spacing: 1px;
        }
        .restart-btn:hover {
            background: #2a152a;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.10), 0 0 0 1px #00f0ff;
        }
        .hidden { display: none !important; }
        #debugInfo { color: #888; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>
<div class="quiz-container">
    <div class="title">▌│█║▌║▌│ PYTHON_QUIZ ║▌│█║▌║▌│</div>
    <div class="score-row">
        <span class="score-label" id="scoreDisplay">Score: 0 | Lives: ❤️❤️❤️ | Level: 0</span>
        <span class="high-score-label" id="highScoreDisplay">🏆 High Score: Level 0 | Total Correct: 0</span>
    </div>
    <div class="question-text" id="questionText">Loading questions…</div>
    <div class="feedback-text" id="feedbackText"></div>
    <div id="optionsContainer">
        <button class="option-btn" data-index="0"><span class="letter">A)</span> <span class="opt-text"></span></button>
        <button class="option-btn" data-index="1"><span class="letter">B)</span> <span class="opt-text"></span></button>
        <button class="option-btn" data-index="2"><span class="letter">C)</span> <span class="opt-text"></span></button>
        <button class="option-btn" data-index="3"><span class="letter">D)</span> <span class="opt-text"></span></button>
    </div>
    <button class="restart-btn hidden" id="restartBtn">[ REBOOT ]</button>
    <div id="debugInfo"></div>
</div>

<script>

// ============================================================

  {

  },
  {
    "question": "What is the output of bool([]) in Python?",
    "options": ["True", "False", "Error", "None"],

  },
  {

    "options": ["^", "**", "exp()", "pow()"],

    "options": ["key in dict", "dict.has_key(key)", "dict.exists(key)", "key.exists(dict)"],
    "answer": 0
  },
  {

    "options": ["Exits the loop", "Does nothing", "Raises an exception", "Skips to the next iteration"],
    "answer": 1
  },
  {
    "question": "Which of the following is a built‑in Python data type?",
    "options": ["array", "vector", "list", "table"],
    "answer": 2
  },
  {
    "question": "What is the result of 'Hello' + 'World'?",
    "options": ["HelloWorld", "Hello World", "Hello+World", "Error"],
    "answer": 0
  },
  {
    "question": "How do you get the number of elements in a list?",
    "options": ["len(list)", "list.len()", "list.length()", "count(list)"],
    "answer": 0
  },
  {
    "question": "Which of the following is used to handle exceptions in Python?",
    "options": ["try-except", "try-catch", "throw-catch", "error-handle"],
    "answer": 0
  },
  {
    "question": "What is the output of 2 ** 3?",
    "options": ["6", "8", "9", "5"],
    "answer": 1
  },
  {
    "question": "Which keyword is used to create a class in Python?",
    "options": ["class", "struct", "object", "def"],
    "answer": 0
  },
  {
    "question": "What is the correct way to open a file for reading?",
    "options": ["open('file.txt', 'r')", "open('file.txt', 'read')", "file.open('file.txt')", "open('file.txt', 'w')"],
    "answer": 0
  },
  {
    "question": "What does the 'upper()' method do on a string?",
    "options": ["Converts to uppercase", "Converts to lowercase", "Capitalizes the first letter", "Removes whitespace"],
    "answer": 0
  },
  {
    "question": "Which of the following is a mutable data type?",
    "options": ["int", "str", "tuple", "dict"],
    "answer": 3
  },
  {
    "question": "How do you write a comment that spans multiple lines?",
    "options": ["/* comment */", "''' comment '''", "# comment #", "// comment //"],
    "answer": 1
  },
  {
    "question": "What is the purpose of the 'self' keyword in class methods?",
    "options": ["Reference to the current instance", "Reference to the class", "Global variable", "It has no purpose"],
    "answer": 0
  },
  {
    "question": "Which function is used to print the data type of a variable?",
    "options": ["type()", "typeof()", "datatype()", "getType()"],
    "answer": 0
  },
  {
    "question": "What is the result of 7 / 2 in Python 3?",
    "options": ["3.5", "3", "2", "3.0"],
    "answer": 0
  },
  {
    "question": "How do you remove the last item from a list?",
    "options": ["list.pop()", "list.remove()", "list.delete()", "list.removeLast()"],
    "answer": 0

  {
    "question": "Which of the following is a valid way to loop through a list?",
    "options": ["for i in list:", "for (i=0; i<list.length; i++):", "foreach i in list:", "while i in list:"],

  {

  },

    "answer": 0

    "options": ["Adds an item to the end", "Adds an item to the beginning", "Inserts an item at a specific index", "Removes an item"],

  },
  {
    "question": "Which function is used to get the length of a string?",
    "options": ["len()", "length()", "size()", "count()"],
    "answer": 0
  },
  {
    "question": "What is the result of 'a' in 'abc'?",
    "options": ["True", "False", "Error", "None"],
    "answer": 0
  },
  {
    "question": "How do you round a number to the nearest integer?",
    "options": ["round()", "ceil()", "floor()", "int()"],
    "answer": 0
  },
  {
    "question": "Which of the following is NOT a valid Python comment?",
    "options": ["# comment", "\"\"\" comment \"\"\"", "// comment", "''' comment '''"],
    "answer": 2
  },
  {
    "question": "What is the output of print(3 * 'a')?",
    "options": ["aaa", "3a", "a3", "Error"],
    "answer": 0
  },
  {
    "question": "Which method is used to split a string into a list?",
    "options": ["split()", "break()", "separate()", "div()"],
    "answer": 0
  },
  {
    "question": "What is the output of bool(0) in Python?",
    "options": ["True", "False", "Error", "None"],
    "answer": 1
  },
  {
    "question": "Which of the following is a valid file extension for Python code?",
    "options": [".py", ".java", ".cpp", ".js"],
    "answer": 0
  },
  {
    "question": "How do you write a for loop that iterates over a dictionary's keys?",
    "options": ["for key in dict:", "for key, value in dict:", "for key in dict.keys():", "Both A and C"],
    "answer": 3
  },
  {
    "question": "What does the 'continue' statement do?",
    "options": ["Skips the rest of the current iteration", "Exits the loop", "Raises an exception", "Restarts the loop"],
    "answer": 0
  },
  {
    "question": "Which of the following is a Python keyword?",
    "options": ["function", "class", "var", "typedef"],
    "answer": 1
  },
  {
    "question": "What is the output of print(1, 2, 3, sep='-')?",
    "options": ["1-2-3", "1 2 3", "1,2,3", "123"],
    "answer": 0
  },
  {
    "question": "How do you check if a variable is an integer?",
    "options": ["isinstance(x, int)", "type(x) == int", "x.is_int()", "Both A and B"],
    "answer": 3
  },
  {
    "question": "Which method is used to clear all items from a list?",
    "options": ["clear()", "removeAll()", "empty()", "delete()"],
    "answer": 0
  },
  {
    "question": "What is the result of max([1, 5, 3])?",
    "options": ["5", "3", "1", "6"],
    "answer": 0
  },
  {
    "question": "Which of the following is used to generate random numbers?",
    "options": ["random", "math", "os", "sys"],
    "answer": 0
  },
  {
    "question": "What is the output of int('10', 2)?",
    "options": ["2", "10", "8", "Error"],
    "answer": 0
  }
];

// ============================================================
//  GAME STATE
// ============================================================
const QUESTIONS_PER_ROUND = 20;
const MAX_LIVES = 3;
const HIGH_SCORE_KEY = 'python_quiz_high_score';

let allQuestions = [];
let currentPool = [];
let currentIndex = 0;
let score = 0;
let lives = MAX_LIVES;
let level = 0;
let totalCorrect = 0;
let usedQuestions = [];
let isAnswered = false;
let timeoutId = null;

// DOM refs
const questionEl = document.getElementById('questionText');
const feedbackEl = document.getElementById('feedbackText');
const scoreDisplay = document.getElementById('scoreDisplay');
const highScoreDisplay = document.getElementById('highScoreDisplay');
const optionBtns = document.querySelectorAll('.option-btn');
const restartBtn = document.getElementById('restartBtn');
const debugEl = document.getElementById('debugInfo');

// ============================================================
//  HIGH SCORE
// ============================================================
function loadHighScore() {
    try {
        const cookies = document.cookie.split('; ');
        for (let cookie of cookies) {
            const [name, value] = cookie.split('=');
            if (name === HIGH_SCORE_KEY) {
                return JSON.parse(decodeURIComponent(value));
            }
        }
    } catch (_) {}
    return { level: 0, total_correct: 0 };
}

function saveHighScore(levelVal, totalCorrectVal) {
    const data = JSON.stringify({ level: levelVal, total_correct: totalCorrectVal });
    // Cookie expires in 1 year
    document.cookie = `${HIGH_SCORE_KEY}=${encodeURIComponent(data)}; path=/; max-age=31536000`;
}
let highScore = loadHighScore();

function updateHighScoreDisplay() {
    highScoreDisplay.textContent =
        `🏆 High Score: Level ${highScore.level} | Total Correct: ${highScore.total_correct}`;
}
updateHighScoreDisplay();

// ============================================================
//  UI HELPERS
// ============================================================
function updateStatus() {
    const hearts = '❤️'.repeat(lives) + '🖤'.repeat(MAX_LIVES - lives);
    scoreDisplay.textContent = `Score: ${score} | Lives: ${hearts} | Level: ${level}`;
}

function setFeedback(text, color) {
    feedbackEl.textContent = text;
    feedbackEl.style.color = color || '#00f0ff';
}

function enableOptions(enabled) {
    optionBtns.forEach(btn => btn.disabled = !enabled);
}

function resetOptionStyles() {
    optionBtns.forEach(btn => {
        btn.classList.remove('correct-answer', 'wrong-answer', 'reveal-answer');
    });
}

function showRestartButton(show) {
    restartBtn.classList.toggle('hidden', !show);
}

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// ============================================================
//  GAME LOGIC
// ============================================================
function loadRound() {
    if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; }
    currentIndex = 0;
    lives = MAX_LIVES;
    score = 0;
    isAnswered = false;
    showRestartButton(false);
    resetOptionStyles();
    enableOptions(true);

    const available = allQuestions.filter(q => !usedQuestions.includes(q));
    if (available.length === 0) {
        setFeedback('🏁 No more questions! You\'ve mastered them all!', '#00ff66');
        questionEl.textContent = '🎉 All questions completed!';
        enableOptions(false);
        showRestartButton(true);
        debugEl.textContent = `Available: ${available.length}, Total: ${allQuestions.length}`;
        return;
    }
    currentPool = shuffleArray(available).slice(0, Math.min(QUESTIONS_PER_ROUND, available.length));
    showQuestion();
}

function showQuestion() {
    if (currentIndex >= currentPool.length) {
        levelUp();
        return;
    }
    const q = currentPool[currentIndex];
    questionEl.textContent = q.question;
    resetOptionStyles();
    isAnswered = false;
    enableOptions(true);
    optionBtns.forEach((btn, i) => {
        btn.querySelector('.opt-text').textContent = q.options[i] || '';
        btn.dataset.correct = (i === q.answer) ? 'true' : 'false';
    });
    setFeedback('');
    updateStatus();
    debugEl.textContent = `Question ${currentIndex+1}/${currentPool.length}`;
}

function checkAnswer(selectedIndex) {
    if (isAnswered || currentIndex >= currentPool.length) return;
    const q = currentPool[currentIndex];
    const isCorrect = (selectedIndex === q.answer);
    const btn = optionBtns[selectedIndex];
    enableOptions(false);
    isAnswered = true;
    resetOptionStyles();

    if (isCorrect) {
        btn.classList.add('correct-answer');
        score += 1;
        totalCorrect += 1;
        setFeedback('✅ CORRECT', '#00ff66');
    } else {
        btn.classList.add('wrong-answer');
        const correctBtn = optionBtns[q.answer];
        correctBtn.classList.add('reveal-answer');
        const letters = ['A', 'B', 'C', 'D'];
        setFeedback(`❌ WRONG — Answer was ${letters[q.answer]}) ${q.options[q.answer]}`, '#ff0044');
        lives -= 1;
    }
    updateStatus();

    if (lives === 0) {
        gameOver();
        return;
    }
    if (timeoutId) clearTimeout(timeoutId);
    timeoutId = setTimeout(() => {
        timeoutId = null;
        currentIndex += 1;
        if (currentIndex >= currentPool.length) {
            levelUp();
        } else {
            showQuestion();
        }
    }, 800);
}

function levelUp() {
    if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; }
    level += 1;
    usedQuestions = usedQuestions.concat(currentPool);
    setFeedback(`🔥 LEVEL ${level} COMPLETE! Loading next round...`, '#00f0ff');
    updateStatus();
    timeoutId = setTimeout(() => {
        timeoutId = null;
        loadRound();
    }, 1200);
}

function gameOver() {
    if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; }
    questionEl.textContent = '💀 GAME OVER';
    enableOptions(false);
    resetOptionStyles();
    setFeedback(`Final Score: ${score} | Level: ${level}`, '#ff0044');

    if (level > highScore.level || (level === highScore.level && totalCorrect > highScore.total_correct)) {
        highScore = { level, total_correct: totalCorrect };
        saveHighScore(level, totalCorrect);
        updateHighScoreDisplay();
        setFeedback(`🏆 NEW HIGH SCORE! Level ${level} | Total Correct: ${totalCorrect}`, '#ffcc00');
    }
    showRestartButton(true);
}

function restartQuiz() {
    if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; }
    usedQuestions = [];
    level = 0;
    totalCorrect = 0;
    currentIndex = 0;
    score = 0;
    lives = MAX_LIVES;
    isAnswered = false;
    showRestartButton(false);
    resetOptionStyles();
    enableOptions(true);
    setFeedback('');
    updateStatus();
    allQuestions = shuffleArray([...QUESTIONS]);
    loadRound();
}

// ============================================================
//  EVENT LISTENERS
// ============================================================
optionBtns.forEach((btn) => {
    btn.addEventListener('click', function() {
        const idx = parseInt(this.dataset.index, 10);
        checkAnswer(idx);
    });
});

restartBtn.addEventListener('click', restartQuiz);

// Keyboard: 1/A, 2/B, 3/C, 4/D, R for restart
document.addEventListener('keydown', (e) => {
    const key = e.key.toUpperCase();
    let idx = -1;
    if (['1', 'A'].includes(key)) idx = 0;
    else if (['2', 'B'].includes(key)) idx = 1;
    else if (['3', 'C'].includes(key)) idx = 2;
    else if (['4', 'D'].includes(key)) idx = 3;
    else if (key === 'R' && !restartBtn.classList.contains('hidden')) {
        restartBtn.click();
        return;
    }
    if (idx >= 0 && idx < optionBtns.length) {
        const btn = optionBtns[idx];
        if (!btn.disabled) btn.click();
    }
});

// ============================================================
//  START
// ============================================================
allQuestions = shuffleArray([...QUESTIONS]);
usedQuestions = [];
level = 0;
totalCorrect = 0;
debugEl.textContent = `Loaded ${allQuestions.length} questions.`;
loadRound();

window.addEventListener('beforeunload', () => {
    if (timeoutId) clearTimeout(timeoutId);
});
</script>
</body>
</html>
